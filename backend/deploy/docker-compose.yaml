name: hnt-auth

# Generic Docker-compatible host. PostgreSQL is intentionally external and persistent.
services:
  auth:
    build:
      context: ..
      dockerfile: Dockerfile
    image: hnt-auth-backend:local
    restart: unless-stopped
    init: true
    env_file: ./production.env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true