name: Backend CI

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hnt
          POSTGRES_PASSWORD: hnt
          POSTGRES_DB: hnt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U hnt -d hnt_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://hnt:hnt@localhost:5432/hnt_test
      TEST_DATABASE_URL: postgresql+asyncpg://hnt:hnt@localhost:5432/hnt_test
      AUTH_HASH_PEPPER: test-only-insecure-hash-pepper-not-for-production
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest -q